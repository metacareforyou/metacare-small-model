# The visit scribe's extraction model (MET-1930): reads a transcript, writes the visit's facts as JSON.
# Same base as the health model; only the task and the data differ. Export at q4, never q4f16.
name: granite-h-350m-scribe-v0

base:
  repo: ibm-granite/granite-4.0-h-350m
  revision: 3b17b717b8f2f5d305b0a92c1491e239aeda19c8   # read from the Hugging Face API, 2026-11-09
  licence: Apache-2.0
  model_type: granitemoehybrid

data:
  pairs: data/private/scribe/pairs.jsonl   # built by scribe.pairs; made up visits, kept out of the repository

lora:
  r: 32
  alpha: 64
  dropout: 0.05
  target_modules: all-linear

training:
  epochs: 3
  learning_rate: 2.0e-4
  batch_size: 8
  gradient_accumulation: 2
  max_length: 2048
  seed: 42
  output_dir: runs/granite-h-350m-scribe-v0

export:
  dtype: q4
